name: Inspect or configure NEWSHOT refresh backend

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Configure the existing Pages project with the refresh relay
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify target and optionally configure the relay
        run: python3 tools/refresh_cloud_setup.py ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEWSHOT_REFRESH_ADMIN_HASH: ${{ secrets.NEWSHOT_REFRESH_ADMIN_HASH }}
          NEWSHOT_REFRESH_AGENT_HASH: ${{ secrets.NEWSHOT_REFRESH_AGENT_HASH }}
          NEWSHOT_REFRESH_SESSION_SECRET: ${{ secrets.NEWSHOT_REFRESH_SESSION_SECRET }}
